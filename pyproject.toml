[project]
name = "tsforecasting"
version = "0.1.0"
description = "A laboratory for classical, ML, deep learning and foundation-model time-series forecasting"
authors = [{ name = "Alejandro Gomez", email = "alejandrogomezechavarria@gmail.com" }]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "lightgbm>=4.7.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyprojroot>=0.3.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "skforecast>=0.25.0",
    "sktime>=1.2.0",
    "torch>=2.14.1",
]

[project.urls]
Homepage = "https://example.com"
Repository = "https://example.com"
Documentation = "https://example.com/docs"

[project.scripts]
my-cli = "tsforecasting.__main__:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

# `uv sync` / `uv run` install every dependency group by default
[tool.uv]
default-groups = "all"

# Configure pytest
[tool.pytest.ini_options]
addopts = "--cov=src"
testpaths = ["tests"]

# Configure mypy
[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true

# Configure ruff (linter + formatter)
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["tsforecasting"]

[dependency-groups]
data-science = [
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]
notebook = [
    "ipykernel>=7.4.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
]
viz = [
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "seaborn>=0.13.2",
]
